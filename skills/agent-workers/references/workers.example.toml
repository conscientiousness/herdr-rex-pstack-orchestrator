# workers.toml: configuration for the agent-workers skill.
#
# Copy this file to:
#     $XDG_CONFIG_HOME/herdr-orchestrator/workers.toml
#     (~/.config/herdr-orchestrator/workers.toml when XDG_CONFIG_HOME is unset)
#
# Keep only the workers you use, and adjust models, efforts, and permission
# flags. Model names below are examples. One worker is enough; roles may share it.
#
# Verify your setup once after editing:
#     python3 <skill-dir>/scripts/agent-workers.py check --cwd /some/work/dir
#
# Worker names match [a-z][a-z0-9-]{0,15}. Descriptions guide controller
# selection when no role matches.

# Maximum open tasks in one capacity scope. Default 4.
max_active_workers = 4

# Emit a long_running notice once after this many minutes. Default 180.
notify_after_minutes = 180

[workers.glm]
description = "Bounded tooling changes and mechanical edits."
harness = "pi"
provider = "zai"
model = "glm-5.3-flash"
effort = "max" # Pi thinking level: off, minimal, low, medium, high, xhigh, max

[workers.gpt]
description = "Implementation, ordinary fixes, and refactoring."
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium" # Codex model_reasoning_effort
# These flags define the worker's authorization.
args = ["-s", "workspace-write", "-a", "on-request", "-c", 'approvals_reviewer="auto_review"']

[workers.haiku]
description = "Independent review of a bounded diff and its evidence."
harness = "claude"
model = "haiku"
effort = "max" # claude --effort
args = ["--permission-mode", "auto"]

[workers.flash]
description = "Fast investigation and bounded fixes."
harness = "agy"
# Run `agy models` for available IDs. Use an effort-suffixed ID without `effort`,
# or a base model name with `effort`.
model = "gemini-3.8-flash-high"
args = ["--mode", "auto"]

# Optional role routing for pstack-adapter.
# Single roles name one worker; panel roles list one worker per fresh task.
[roles]
"feature, refactoring" = "gpt"
"interrogate reviewers" = ["glm", "haiku"]
# With one worker configured, use ["gpt", "gpt"] for two independent runs.
